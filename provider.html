<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

</head>
<body class="provider-app">
  <a class="skip" href="#workspace">본문으로 이동</a>
  <aside class="sidebar" aria-label="기관용 메뉴">
    <a class="brand" href="provider.html"><img src="assets/apxe.svg?v=6" alt="APXe"><span>care.</span></a>
    <div class="space-label">기관용 워크스페이스</div>
    <nav>
      <button class="nav-item active" data-view="overview" aria-current="page"><i data-icon="user"></i>고객 보행 리포트</button>
      <button class="nav-item" data-view="records"><i data-icon="table"></i>공유된 원기록</button>
      <button class="nav-item" data-action="scope"><i data-icon="shield"></i>공유 범위</button>
    </nav>
    <div class="sidebar-bottom"><a href="index.html#overview"><i data-icon="arrow"></i>고객용 앱 열기</a><button data-action="help"><i data-icon="help"></i>서비스 안내</button><div class="staff"><span class="avatar">A</span><div><strong>기관 체험 계정</strong><small>샘플 보행 기록 검토</small></div></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="crumb">고객 관리 <span>/</span> <strong>개인 보행 리포트</strong></div><button class="sample" data-action="help"><span></span>예시 데이터 <i data-icon="info"></i></button></header>
    <main id="workspace" tabindex="-1">
      <div class="subject-header"><div class="subject"><span class="subject-avatar"><i data-icon="user"></i></span><div><div class="subject-title"><h1>가상 사용자 A</h1><span class="subject-id">APX-0001</span></div><p><i data-icon="shield"></i>고객이 선택한 보행 기록 <span>·</span> <span id="subject-range"></span></p></div></div><div class="subject-actions"><select id="period" aria-label="조회 기간"><option value="28">최근 4주</option><option value="7">최근 7일</option></select><button class="button primary" data-action="report"><i data-icon="file"></i>리포트 내보내기</button></div></div>
      <div class="view-tabs"><button class="active" data-view="overview" aria-current="page">보행 요약</button><button data-view="records">원기록</button><label class="condition"><input type="checkbox" id="comparable" checked><span class="toggle"></span>동일 측정 조건</label></div>
      <div id="content"></div>
    </main>
    <footer>APXe Care <span>보행 관찰·검사와 함께 확인하는 개인 보행 기록</span></footer>

  <nav class="provider-mobile-nav" aria-label="기관용 하단 메뉴">
    <button data-view="overview" class="active" aria-current="page"><i data-icon="user"></i><span>보행 요약</span></button>
    <button data-view="records"><i data-icon="table"></i><span>원기록</span></button>
    <button data-action="scope"><i data-icon="shield"></i><span>공유 범위</span></button>
    <a href="index.html#overview"><i data-icon="arrow"></i><span>고객용 앱</span></a>
  </nav>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
